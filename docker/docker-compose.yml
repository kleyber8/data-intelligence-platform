# ============================================================
# Data Intelligence Platform — Stack de desarrollo local
# Levanta: PostgreSQL (proyecto + airflow), MinIO, Airflow.
# ============================================================

x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: airflow/Dockerfile
  env_file:
    - ../.env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_POSTGRES_PASSWORD}@airflow-postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "True"
    PYTHONPATH: /opt/airflow
    PROJECT_ROOT: /opt/airflow
    DATA_LAKE_ROOT: /opt/airflow/data
    DATA_LAKE_RAW_DIR: /opt/airflow/data/raw
    DATA_LAKE_BRONZE_DIR: /opt/airflow/data/bronze
    DATA_LAKE_SILVER_DIR: /opt/airflow/data/silver
    DATA_LAKE_GOLD_DIR: /opt/airflow/data/gold
    DATA_LAKE_QUARANTINE_DIR: /opt/airflow/data/quarantine
    DATA_LAKE_METADATA_DIR: /opt/airflow/data/metadata
    POSTGRES_HOST: project-postgres
    POSTGRES_PORT: "5432"
    S3_ENDPOINT_URL: http://minio:9000
  volumes:
    - ../airflow/dags:/opt/airflow/dags
    - ../airflow/plugins:/opt/airflow/plugins
    - ../airflow/logs:/opt/airflow/logs
    - ../airflow/config:/opt/airflow/config
    - ../src:/opt/airflow/src
    - ../ingestion:/opt/airflow/ingestion
    - ../dbt:/opt/airflow/dbt
    - ../data:/opt/airflow/data
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    airflow-postgres:
      condition: service_healthy

services:

  # ---------- PostgreSQL: metadata de Airflow ----------
  airflow-postgres:
    image: postgres:16-alpine
    container_name: dip-airflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD}
      POSTGRES_DB: airflow
    ports:
      - "${AIRFLOW_POSTGRES_PORT:-5433}:5432"
    volumes:
      - airflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- PostgreSQL: base del proyecto ----------
  project-postgres:
    image: postgres:16-alpine
    container_name: dip-project-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - project_pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- MinIO: emulador S3 ----------
  minio:
    image: coollabsio/minio:latest
    container_name: dip-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- MinIO init: crea buckets ----------
  minio-init:
    image: coollabsio/minio:latest
    container_name: dip-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set local http://minio:9000 "${S3_ACCESS_KEY_ID}" "${S3_SECRET_ACCESS_KEY}" &&
        mc mb --ignore-existing local/"${S3_BUCKET_RAW}" &&
        mc mb --ignore-existing local/"${S3_BUCKET_BRONZE}" &&
        echo 'Buckets creados correctamente.' &&
        exit 0

  # ---------- Airflow Init (una sola vez) ----------
  airflow-init:
    <<: *airflow-common
    container_name: dip-airflow-init
    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email "${AIRFLOW_ADMIN_EMAIL}"
    restart: "no"

  # ---------- Airflow Webserver ----------
  airflow-webserver:
    <<: *airflow-common
    container_name: dip-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ---------- Airflow Scheduler ----------
  airflow-scheduler:
    <<: *airflow-common
    container_name: dip-airflow-scheduler
    command: scheduler
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  airflow_pgdata:
  project_pgdata:
  minio_data:
