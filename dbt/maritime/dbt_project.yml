name: 'maritime'
version: '1.0.0'
config-version: 2
profile: 'data_intelligence_platform'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

on-run-start:
  - "SET work_mem = '256MB'"

models:
  maritime:
    staging:
      +materialized: table
      +schema: silver
      +tags: ["staging", "silver"]
    intermediate:
      +materialized: table
      +schema: silver
      +tags: ["intermediate", "silver"]
    marts:
      +materialized: table
      +schema: gold
      +tags: ["gold"]
